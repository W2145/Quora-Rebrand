<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Quora</title>
        <link rel="stylesheet" href="Quora_CSS.css">

    </head>
    <body>





        <header class="main-header">

            <div class="header-left">
                <h1 class="logo">Quora</h1>
            </div>

            <div class="search-container">
                <div class="search-bar-cover">
                    <i class="search-icon"><img src="img/icons/search.svg" alt="search icon"></i>
                    <input type="text" placeholder="Type in search" class="search-input">
                </div>
            </div>

            <div class="user-profile-group">
                <span class="user-name">Beth Huntsman</span>
                <img src="img/Profile Picture Woman.jpg" class="profile-pic" alt="profile picture">
            </div>

        

        </header>

        <div class="app-container">

            <nav class="sidebar">
                <h2 class="logo">Connected</h2>
                <ul>
                    <li><i class="icon"></i>Home</li>
                    <li><i class="icon"></i>Profile</li>
                </ul>
            </nav>

            <main class="feed">
                
                <input type="text" placeholder="What do you want to Ask or Share?">

                <div class="action-bar">
                    <button class="action-button">
                        <span class="icon">&#x2754;</span>
                        <span>Ask</span>

                    </button>

                    <div class="separator"></div>

                    <button class="action-button">
                        <span class="icon">&#x1F4C4;</span>
                        <span>Answer</span>
                    </button>

                    <div class="separator"></div>

                    <button class="action-button">
                        <span class="icon">✎</span>
                        <span>Post</span>
                    </button>

                </div>

                <div class="card">
                    <div class="card-header">Robert Hammond</div>
                    <p>my wife prepared a trip...</p>
                    <div class="card-images">
                        <img src>
                    </div>
                </div>
            </main>

            <aside class="info-panel">
                <section class="events">
                    <h3>Upcoming Events</h3>
                    <div class="event-item"> Garden BBQ -June 16</div>
                </section>
            </aside>
        </div>
    </body>
</html>
