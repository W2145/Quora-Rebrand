<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Quora</title>
        <link rel="stylesheet" href="Quora_CSS.css">

    </head>
    <body>





        <header class="main-header">

            <div class="header-left">
                <h1 class="logo">connected</h1>
            </div>

            <div class="search-container">
            <i class="search-icon"><img src="img/icons/search.svg" alt="search icon"></i>
            <input type="text" placeholder="Type in search" class="search-bar">
            </div>

            <div class="user-profile-group">
                <span class="user-name">Beth Huntsman</span>
                <img src="img/Profile Picture Woman.jpg" class="profile-pic" alt="profile picture">
            </div>

        

        </header>

        <div class="app-container">

            <nav class="sidebar">
                <h2 class="logo">Connected</h2>
                <ul>
                    <li><i class="icon"></i>Home</li>
                    <li><i class="icon"></i>Profile</li>
                </ul>
            </nav>

            <main class="feed">
                <h2 class="post-box">Feed</h2>
                <input type="text" placeholder="Whats on your mind">
                <button>Post</button>

                <div class="card">
                    <div class="card-header">Robert Hammond</div>
                    <p>my wife prepared a trip...</p>
                    <div class="card-images">
                        <img src>
                    </div>
                </div>
            </main>

            <aside class="info-panel">
                <section class="events">
                    <h3>Upcoming Events</h3>
                    <div class="event-item"> Garden BBQ -June 16</div>
                </section>
            </aside>
        </div>
    </body>
</html>
